<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PODIUM — offline</title>
  <body style="margin:0;box-sizing:border-box;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#080a1d;color:#f2f2f3;font-family:system-ui,sans-serif;text-align:center;padding:max(24px,var(--safe-area-inset-top,env(safe-area-inset-top,0px))) max(24px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) max(24px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(24px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))">
    <div>
      <div style="font-size:12px;letter-spacing:.3em;color:#00b5cc;margin-bottom:12px">PODIUM · BFT MENA</div>
      <h1 style="font-size:22px;margin:0 0 10px">You are offline</h1>
      <p lang="ar" dir="rtl" style="color:#b7b9ca;margin:0 0 18px">انقطع الاتصال بالإنترنت. أعد الاتصال ثم حاول مرة أخرى.</p>
      <button onclick="retry()" style="min-height:48px;background:#00b5cc;color:#04212a;border:0;border-radius:10px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer">Try again · حاول مرة أخرى</button>
    </div>
    <script src="capacitor.js"></script>
    <script>
      async function retry() {
        let path = '/login';
        try {
          const preferences = window.Capacitor && window.Capacitor.registerPlugin('Preferences');
          const saved = preferences ? (await preferences.get({ key: 'podium:lastPath' })).value : sessionStorage.getItem('podium:lastPath');
          if (saved && saved.startsWith("/") && !saved.startsWith("//") && !/[\\\u0000-\u001f]/.test(saved) && !/^\/(login|verify|competitor|activate|reset-password|forgot-password)(\/|[?#]|$)/.test(saved)) path = saved;
        } catch (_) {}
        location.href = 'https://podium.bftmiddleeast.com' + path;
      }
    </script>
  </body>
</html>
