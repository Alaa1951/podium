name: mobile-ios

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

# Serialize uploads so a later build cannot arrive before an earlier build.
concurrency:
  group: mobile-ios-upload
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check signing inputs and select an eligible Xcode
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || { echo "::error::Missing repository secret: $name"; exit 1; }
          done
          # The hosted runner's default can lag Apple's minimum SDK requirement.
          XCODE_APP=$(python3 - <<'PY'
          import pathlib, re
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode_26*.app'):
              if re.fullmatch(r'Xcode_26(?:\.\d+)*\.app', path.name):
                  candidates.append((tuple(map(int, re.findall(r'\d+', path.stem))), str(path)))
          print(max(candidates)[1] if candidates else '')
          PY
          )
          [[ -n "$XCODE_APP" ]] || { echo '::error::macos-15 needs a stable Xcode 26 installation'; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync the live-site shell
        run: npm run mobile:sync -- ios
      - name: Install signing certificate and profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/podium-ios-signing"
          mkdir -p "$SIGNING_DIR"
          KEYCHAIN_PATH="$SIGNING_DIR/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$SIGNING_DIR/distribution.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$SIGNING_DIR/profile.mobileprovision"
          security list-keychains -d user > "$SIGNING_DIR/original-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # The .cer downloaded from Apple contains the leaf certificate only.
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGNING_DIR/AppleWWDRCAG3.cer"
          security import "$SIGNING_DIR/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" > "$SIGNING_DIR/identities.txt"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import datetime, hashlib, os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'podium-ios-signing'
          p = plistlib.loads((root / 'profile.plist').read_bytes())
          assert p['Name'] == 'PODIUM AppStore', 'Wrong provisioning profile name'
          assert p['TeamIdentifier'] == ['VSXS43495X'], 'Wrong Apple team'
          assert p['Entitlements']['application-identifier'] == 'VSXS43495X.app.podium.bftmena', 'Wrong app identifier'
          assert not p['Entitlements'].get('get-task-allow'), 'Development profile cannot be used'
          assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices'), 'App Store profile required'
          assert p['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile expired'
          fingerprints = [hashlib.sha1(c).hexdigest().upper() for c in p['DeveloperCertificates']]
          identities = (root / 'identities.txt').read_text()
          assert any(f in identities for f in fingerprints), 'Imported signing key does not match the profile certificate'
          dest = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (p['UUID'] + '.mobileprovision')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'profile.mobileprovision', dest)
          (root / 'installed-profile-path.txt').write_text(str(dest))
          PY
      - name: Configure signed Release target and unique build number
        shell: bash
        run: |
          set -euo pipefail
          # New runs AND retries get a different CFBundleVersion. Marketing version stays 1.0.
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          text = path.read_text()
          pattern = r'(\t\t[0-9A-F]+ /\* Release \*/ = \{\n\s*isa = XCBuildConfiguration;\n\s*buildSettings = \{)(.*?)(\n\t\t\t\};\n\t\t\tname = Release;\n\t\t\};)'
          changed = 0
          def configure(m):
              global changed
              settings = m[2]
              if 'PRODUCT_BUNDLE_IDENTIFIER = app.podium.bftmena;' not in settings:
                  return m[0]
              changed += 1
              settings = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', settings)
              settings = re.sub(r'CURRENT_PROJECT_VERSION = \d+;', 'CURRENT_PROJECT_VERSION = ' + os.environ['GITHUB_RUN_NUMBER'] + '.' + os.environ['GITHUB_RUN_ATTEMPT'] + ';', settings)
              settings += '\n\t\t\t\tDEVELOPMENT_TEAM = VSXS43495X;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "PODIUM AppStore";'
              return m[1] + settings + m[3]
          text = re.sub(pattern, configure, text, flags=re.S)
          assert changed == 1, 'Expected exactly one PODIUM Release target'
          path.write_text(text)
          PY
      - name: Archive signed app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive
          codesign --verify --deep --strict build/App.xcarchive/Products/Applications/App.app
      - name: Export App Store IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/export -exportOptionsPlist ios/App/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: podium-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/export/*.ipa
            build/App.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
      - name: Upload to App Store Connect with API-key authentication
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          shopt -s nullglob
          files=(build/export/*.ipa)
          [[ ${#files[@]} == 1 ]] || { echo '::error::Expected exactly one IPA'; exit 1; }
          # Xcode releases expose different spellings; inspect the installed tool.
          xcrun altool --help > "$RUNNER_TEMP/podium-altool-help.txt" 2>&1
          if grep -q -- '--api-key' "$RUNNER_TEMP/podium-altool-help.txt"; then
            auth=(--api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID")
          else
            auth=(--apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID")
          fi
          if grep -q -- 'ios-app-store' "$RUNNER_TEMP/podium-altool-help.txt"; then
            platform=(--type ios-app-store)
          elif grep -q -- '--platform' "$RUNNER_TEMP/podium-altool-help.txt"; then
            platform=(--platform ios)
          else
            platform=(--type ios)
          fi
          API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys" xcrun altool \
            --upload-package "${files[0]}" "${platform[@]}" "${auth[@]}" \
            --apple-id 6812904157 --bundle-id app.podium.bftmena \
            --bundle-version "$IOS_BUILD_NUMBER" --bundle-short-version-string 1.0
          echo "Uploaded PODIUM 1.0 ($IOS_BUILD_NUMBER). Wait for Apple processing, then check app 6812904157 in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          SIGNING_DIR="$RUNNER_TEMP/podium-ios-signing"
          if [[ -f "$SIGNING_DIR/installed-profile-path.txt" ]]; then
            rm -f "$(cat "$SIGNING_DIR/installed-profile-path.txt")"
          fi
          if [[ -f "$SIGNING_DIR/original-keychains.txt" ]]; then
            python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'podium-ios-signing/original-keychains.txt'
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(p.read_text())], check=True)
          PY
          fi
          security delete-keychain "$SIGNING_DIR/release.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR"
          if [[ -n "$ASC_KEY_ID" ]]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"; fi
